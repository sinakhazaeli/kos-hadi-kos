<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17364d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Koş Hadi Koş!</title>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <header id="hud" class="hidden">
    <div class="hud-pill"><span id="scoreLabel">Skor</span> <b id="score">0</b></div>
    <div class="hud-pill">🪙 <b id="runCoins">0</b></div>
    <div class="hud-pill">🔥 x<b id="combo">1</b></div>
    <div class="hud-actions">
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸️</button>
    </div>
  </header>

  <div id="missionBar" class="hidden">
    <span id="missionText">Görev: 15 altın topla</span>
    <span id="missionProgress">0/15</span>
  </div>

  <section id="menuScreen" class="screen">
    <div class="panel hero-panel">
      <div class="eyebrow">ISTANBUL RUNNER</div>
      <div class="logo-wrap">
        <div class="logo-mark">🏃‍♂️</div>
        <div>
          <h1>KOŞ HADİ KOŞ!</h1>
          <p id="tagline">İstanbul sokaklarında ritmi yakala.</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat"><span>🏆</span><b id="best">0</b><small id="bestLabel">En iyi</small></div>
        <div class="stat"><span>🪙</span><b id="wallet">0</b><small id="walletLabel">Altın</small></div>
        <div class="stat"><span>🎁</span><b id="gifts">0</b><small id="giftLabel">Hediye</small></div>
      </div>

      <button class="primary-btn" id="playBtn">OYNA</button>

      <div class="button-row">
        <button class="secondary-btn" id="dailyBtn">🎁 Günlük Ödül</button>
        <button class="secondary-btn" id="howBtn">Nasıl Oynanır?</button>
      </div>
      <div class="button-row">
        <button class="secondary-btn" id="shareBtn">📤 Arkadaşına Gönder</button>
        <button class="secondary-btn" id="langBtn">🌐 Türkçe</button>
      </div>
    </div>
  </section>

  <section id="pauseScreen" class="screen hidden">
    <div class="panel compact-panel">
      <div class="big-icon">⏸️</div>
      <h2 id="pauseTitle">DURAKLATILDI</h2>
      <button class="primary-btn" id="resumeBtn">DEVAM ET</button>
      <button class="secondary-btn full" id="quitBtn">ANA MENÜ</button>
    </div>
  </section>

  <section id="gameOverScreen" class="screen hidden">
    <div class="panel compact-panel">
      <div class="big-icon">🌉</div>
      <h2 id="gameOverTitle">KOŞU BİTTİ</h2>
      <p class="result-line"><span id="finalScoreLabel">Skor</span> <b id="finalScore">0</b></p>

      <div class="stats-grid results">
        <div class="stat"><span>🪙</span><b id="earnedCoins">0</b><small id="earnedLabel">Kazandın</small></div>
        <div class="stat"><span>🔥</span><b id="bestCombo">1</b><small id="comboLabel">Kombo</small></div>
        <div class="stat"><span>🎯</span><b id="missionResult">—</b><small id="missionLabel">Görev</small></div>
      </div>

      <button class="primary-btn" id="restartBtn">TEKRAR OYNA</button>
      <div class="button-row">
        <button class="secondary-btn" id="shareScoreBtn">📤 Skoru Paylaş</button>
        <button class="secondary-btn" id="homeBtn">ANA MENÜ</button>
      </div>
    </div>
  </section>

  <div id="tutorial" class="hidden">
    <div id="tutorialTitle">Hazır mısın?</div>
    <div id="tutorialHint">Zıplamak için dokun</div>
    <div id="countdown">3</div>
  </div>

  <div id="toast"></div>
  <div id="rewardFlash"><span id="rewardText">+1 🪙</span></div>
</div>

<script src="game.js"></script>
</body>
</html>
